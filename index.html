<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symphony - Music Search & Play</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Animated background -->
    <div class="background-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    
    <div class="app-container">
        <header>
            <h1>Symphony</h1>
            <p>Search and discover your favorite tunes.</p>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search for a song, artist, or album...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
        </header>

        <main id="resultsContainer" class="results-grid">
            <!-- Results will be dynamically injected here -->
        </main>
    </div>

    <!-- Music Player Component -->
    <div id="player" class="player-container hidden">
        <div class="player-info">
            <img id="playerCover" src="" alt="Album Cover">
            <div class="player-details">
                <h3 id="playerTitle">Song Title</h3>
                <p id="playerArtist">Artist Name</p>
            </div>
        </div>
        <div class="player-controls">
            <button id="playPauseBtn"><i class="fas fa-play"></i></button>
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <span id="timeDisplay">0:00 / 0:30</span>
        </div>
        <button id="closePlayerBtn"><i class="fas fa-times"></i></button>
        <audio id="audioElement" preload="metadata"></audio>
    </div>

    <script src="app.js"></script>
</body>
</html>
